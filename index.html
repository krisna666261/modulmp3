<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Pemutar MP3</title>
    <!-- Menghubungkan file CSS dengan pembaruan versi cache -->
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

    <div class="app-container">
        
        <!-- PANEL PEMUTAR UTAMA -->
        <div class="player-panel">
            <h2>AUDIO MODUL</h2>
            <div class="player-box">
                <h3 id="now-playing" class="now-playing-text">Pilih lagu dari playlist</h3>
                <audio id="audioPlayer" controls>
                    Browser Anda tidak mendukung elemen audio.
                </audio>
            </div>
        </div>

        <!-- PANEL PLAYLIST DROPBOX -->
        <div class="playlist-panel">
            <h3>PLAYLIST</h3>
    
            <!-- Menu Pilihan Playlist -->
            <select id="playlistSelect" class="playlist-dropdown">
                <!-- Opsi playlist dimuat otomatis dari JavaScript -->
            </select>

            <ul id="mp3-list" class="playlist">
                <!-- Daftar lagu di-generate otomatis oleh JavaScript -->
            </ul>
        </div>

    </div>

    <!-- Menghubungkan file JavaScript utama -->
    <script src="script.js"></script>
</body>
</html>
